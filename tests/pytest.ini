[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_docker: marks tests that require Docker daemon
    requires_sudo: marks tests that require sudo/admin privileges
    reliability: marks reliability tests (100 runs)
    performance: marks performance benchmarking tests
log_cli = true
log_cli_level = INFO
log_file = tests/logs/pytest.log
log_file_level = DEBUG
timeout = 300
